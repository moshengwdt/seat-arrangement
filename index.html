<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>观光列车智能运营中台</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("seat-theme");
        if (!t) t = (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="static/style.css?v=20260829" />
</head>
<body>
  <header class="brand-bar">
    <span class="brand-name">星享铁游游</span>
    <span class="brand-en">yoorail</span>
  </header>
  <button type="button" class="theme-toggle" id="theme-toggle" aria-label="切换明暗主题">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
    </svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
    </svg>
  </button>
  <div id="liquid-sheen"></div>

  <!-- 平台首页 -->
  <main class="container home-view" id="view-home">
    <h1>观光列车智能运营中台</h1>
    <p class="home-sub">选择下方功能模块开始使用</p>
    <div class="platform-grid">
      <button type="button" class="platform-card" id="go-seat">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11h13l2.5 3.5V17a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z" />
            <path d="M4 11V7.5A1.5 1.5 0 0 1 5.5 6h8A1.5 1.5 0 0 1 15 7.5V11" />
            <circle cx="7" cy="19" r="1.4" />
            <circle cx="12" cy="19" r="1.4" />
            <circle cx="17" cy="19" r="1.4" />
            <path d="M15 8.5h2.2l2.3 2.5" />
          </svg>
        </span>
        <span class="platform-name">智能排座</span>
        <span class="platform-desc">上传订单数据，自动生成排座方案与短信清单</span>
        <span class="platform-arrow">→</span>
      </button>
      <button type="button" class="platform-card" id="go-seatmap">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h4l2-6 4 12 2-6h6" />
          </svg>
        </span>
        <span class="platform-name">列车运营情况</span>
        <span class="platform-desc">查看排座后的列车座位实时占用情况</span>
        <span class="platform-arrow">→</span>
      </button>
      <button type="button" class="platform-card" disabled aria-disabled="true">
        <span class="platform-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 8 0v4" />
            <circle cx="12" cy="16" r="1.3" />
          </svg>
        </span>
        <span class="platform-name">功能开发中</span>
        <span class="platform-desc">更多业务模块正在建设中，敬请期待</span>
        <span class="platform-badge">开发中</span>
      </button>
    </div>
  </main>

  <!-- 排座模块 -->
  <main class="container seat-view" id="view-seat">
    <a class="back-link" href="#/home">← 返回平台首页</a>
    <h1>观光列车智能排座助手</h1>

    <!-- ① 排座 -->
    <section class="panel step">
      <h2>① 排座</h2>
      <form id="seat-form">
        <label>
          游客信息表（多维数据）
          <input type="file" name="file" accept=".xlsx,.xls,.csv" required />
        </label>
        <label>
          订单数据表（导出门票明细）
          <input type="file" name="orders" accept=".xlsx,.xls,.csv" />
        </label>
        <label>
          列车
          <div class="train-wrap">
            <button type="button" class="glass-select" id="train-select-btn" aria-haspopup="listbox" aria-expanded="false">
              <span id="train-select-label">请选择列车</span>
            </button>
            <input type="hidden" name="train" id="train-value" value="" />
          </div>
        </label>
        <label>
          游玩日期
          <div class="date-wrap">
            <input type="date" name="date" required />
            <button type="button" class="date-cal-btn" id="date-cal-btn" aria-label="选择日期">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="3" />
                <path d="M3 10h18M8 3v4M16 3v4" />
              </svg>
            </button>
          </div>
        </label>
        <button type="submit" class="btn" id="submit-btn">开始排座</button>
        <p id="error" class="error hidden"></p>
      </form>

      <section id="progress" class="hidden" aria-live="polite">
        <h3>排座进度</h3>
        <div class="progress-track">
          <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <p id="progress-stage" class="stage">准备中…</p>
      </section>

      <section id="summary" class="hidden" aria-live="polite">
        <h3>排座结果</h3>
        <div id="summary-meta" class="meta"></div>
        <table id="summary-table"></table>
        <a id="download-btn" class="btn disabled" href="#" download aria-disabled="true">下载排座总表</a>
        <p class="hint hidden" id="sms-ready-hint">排座完成，可在下方 ② 生成短信清单。</p>
      </section>
    </section>

    <!-- ② 短信梳理 -->
    <section class="panel step">
      <h2>② 短信梳理</h2>
      <p class="hint">基于最近一次排座结果生成短信清单（联系人信息已随排座阶段获取，无需再次上传订单表）。</p>
      <form id="sms-form">
        <button type="submit" class="btn" id="sms-submit-btn">生成短信清单</button>
        <p id="sms-error" class="error hidden"></p>
      </form>

      <section id="sms-progress" class="hidden" aria-live="polite">
        <h3>短信梳理进度</h3>
        <div class="progress-track">
          <div id="sms-progress-bar" class="progress-bar" style="width: 0%"></div>
        </div>
        <p id="sms-progress-stage" class="stage">准备中…</p>
      </section>

      <section id="sms-summary" class="hidden" aria-live="polite">
        <h3>短信清单</h3>
        <div id="sms-meta" class="meta"></div>
        <a id="sms-download-btn" class="btn disabled" href="#" download aria-disabled="true">下载短信内容</a>
        <a id="sms-detail-download-btn" class="btn disabled" href="#" download aria-disabled="true">下载短信明细</a>
        <a id="sms-manifest-download-btn" class="btn disabled" href="#" download aria-disabled="true">下载发送清单</a>
      </section>
    </section>

    <p class="hint">提示：请只上传一辆车的订单数据；先选列车再选游玩日期，日期决定当日开行的交路与站间段。</p>
    <p class="hint" id="origin-info"></p>
  </main>

  <!-- 列车运营情况模块 -->
  <main class="container seatmap-view" id="view-seatmap">
    <a class="back-link" href="#/home">← 返回平台首页</a>
    <h1>列车运营情况</h1>
    <p class="hint" id="seatmap-status">加载中…</p>
    <div id="seatmap-root"></div>
  </main>

  <!-- 弹窗（提示 / 人工确认） -->
  <div id="modal" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-box">
      <h3 id="modal-title"></h3>
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn secondary hidden">取消</button>
        <button id="modal-ok" class="btn hidden">知道了</button>
        <button id="modal-confirm" class="btn hidden">确认</button>
      </div>
    </div>
  </div>

  <script src="static/config.js?v=20260829"></script>
  <script src="static/app.js?v=20260829"></script>
</body>
</html>
